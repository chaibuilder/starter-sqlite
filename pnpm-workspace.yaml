packages:
  - '.'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - chaipro@0.1.0 || 0.1.13 || 0.1.14 || 0.2.1 || 0.2.3 || 0.2.4 || 0.2.6 || 0.3.0 || 0.3.2 || 0.3.3 || 0.3.5

overrides:
  "framer-motion@12.23.20>motion-dom": "12.23.20"
  "framer-motion@12.23.20>motion-utils": "12.23.6"
  # pin Payload stack so nested plugins don't pull a second @payloadcms/ui
  "@payloadcms/ui": "3.88.0"
  "@payloadcms/storage-s3": "3.88.0"
  "@payloadcms/plugin-cloud-storage": "3.88.0"
  "@payloadcms/db-sqlite": "3.88.0"
  "payload": "3.88.0"
